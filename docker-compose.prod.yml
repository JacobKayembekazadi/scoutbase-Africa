# ScoutBase Africa — Production Docker Compose
# =============================================
# CPU-only backend + Roboflow Inference Server + Caddy

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    volumes:
      - scoutbase_uploads:/app/uploads
      - scoutbase_results:/app/results
      - scoutbase_checkpoints:/app/checkpoints
    environment:
      # Database
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD:-}
      - USE_POSTGRES=true

      # SAM3 (Modal GPU offload)
      - SAM3_BACKEND=${SAM3_BACKEND:-modal}
      - SAM3_DEVICE=cpu
      - SAM3_VARIANT=${SAM3_VARIANT:-base}
      - HF_TOKEN=${HF_TOKEN:-}
      - MODAL_TOKEN_ID=${MODAL_TOKEN_ID:-}
      - MODAL_TOKEN_SECRET=${MODAL_TOKEN_SECRET:-}

      # AI Reports
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # CORS
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://scoutbase-api.vercel.app}

      # Roboflow Inference Server
      - INFERENCE_SERVER_URL=http://inference:9001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  inference:
    image: roboflow/roboflow-inference-server-cpu:latest
    ports:
      - "9001:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  scoutbase_uploads:
  scoutbase_results:
  scoutbase_checkpoints:
  caddy_data:
  caddy_config:
