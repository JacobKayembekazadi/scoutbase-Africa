# ScoutBase Africa - Docker Compose Configuration
# ===============================================
# Development compose file with GPU support for SAM3

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Persist uploads and results
      - ./uploads:/app/uploads
      - ./results:/app/results
      # Persist model checkpoints (avoid re-downloading)
      - ./checkpoints:/app/checkpoints
      # Mount code for development (optional, remove for production)
      # - .:/app
    environment:
      # Required: HuggingFace token for SAM3 model access
      - HF_TOKEN=${HF_TOKEN}

      # SAM3 Configuration
      - SAM3_VARIANT=${SAM3_VARIANT:-base}
      - SAM3_DEVICE=${SAM3_DEVICE:-auto}
      - SAM3_LAZY_LOAD=${SAM3_LAZY_LOAD:-true}

      # Optional: Supabase integration
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}

      # Optional: AI report generation
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

    # GPU support (NVIDIA Container Toolkit required)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # Restart policy
    restart: unless-stopped

    # Health check (RL4-10: uses Python instead of curl, which isn't in the image)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

